name: teapremium-fe

# Frontend only. Start the backend (PostgreSQL + API) from the backend repository first.
# Store reaches it through API_INTERNAL_URL (default: the host's port 8080).
# Admin calls /api/v1/* same-origin through Caddy (DEC-16); see infra/README.md.

services:
  store:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        APP: store
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://host.docker.internal:8080}
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${STORE_PORT:-3000}:3000"
    develop:
      watch:
        - action: sync
          path: ../apps/store/src
          target: /workspace/apps/store/src
          initial_sync: true
        - action: sync
          path: ../packages/api-client/src
          target: /workspace/packages/api-client/src
          initial_sync: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  admin:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        APP: admin
    environment:
      PORT: "3001"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"
    develop:
      watch:
        - action: sync
          path: ../apps/admin/src
          target: /workspace/apps/admin/src
          initial_sync: true
        - action: sync
          path: ../packages/api-client/src
          target: /workspace/packages/api-client/src
          initial_sync: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
