name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  frontend:
    name: Frontend verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install, lint, types, frontend tests and builds
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm lint
          corepack pnpm typecheck
          corepack pnpm --filter @teapremium/admin exec playwright install --with-deps chromium
          corepack pnpm test
          corepack pnpm build

  docker:
    name: Docker regression builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build store
        run: docker build -f infra/Dockerfile.web --build-arg APP=store -t tra-hien-store:ci .
      - name: Build admin
        run: docker build -f infra/Dockerfile.web --build-arg APP=admin -t tra-hien-admin:ci .
